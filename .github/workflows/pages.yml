name: 'Deploy Blue Hour Project'
on:
  push:
    branches: [main]
    paths: ['funding-context-charts.js', 'scripts/extend_interest_history.py', 'social-preview.png', 'favicon.svg', 'atlas.css', 'atlas-experience.js', 'atlas-chart-tools.js', 'index.html', 'simple.html', 'needs.css', 'needs.js', 'story.js', 'tracker.js', 'tracker.css', 'workforce.js', 'workforce.css', 'research.js', 'research.css', 'atlas-bubbles.js', 'outflows.js', 'award-detail.js', 'legal-review.js', 'notes.js', 'rebuild.js', 'rebuild.css', 'transitions.js', 'vendor/**', 'data/**', 'scripts/validate_change_data.py', 'scripts/prepare_site.py', 'tests/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_interest_history.py'
      - run: python scripts/validate_data.py
      - run: python scripts/validate_change_data.py
      - run: python scripts/validate_comparison.py
      - run: python scripts/validate_allocations.py
      - run: python scripts/validate_legal_review.py
      - run: node tests/legal-review.cjs
      - run: node tests/recipient-sectors.cjs
      - run: node tests/recipient-identities.cjs
      - uses: actions/configure-pages@v5
      - run: |
          python scripts/prepare_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
