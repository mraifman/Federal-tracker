name: Refresh federal agency records
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_agencies.py'
      - 'scripts/refresh_awards.py'
      - '.github/workflows/refresh-federal-data.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve official agency records
        run: |
          python scripts/refresh_agencies.py
          python scripts/refresh_awards.py
      - name: Commit validated data
        run: |
          git config user.name "federal-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/agencies.json data/agency-awards.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official agency records"
            git push
          fi
