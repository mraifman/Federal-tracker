name: Refresh federal agency records
on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/refresh-federal-data.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: federal-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ingestion validation and failure handling
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Retrieve official agency records
        run: |
          python -u scripts/refresh_agencies.py
          python -u scripts/refresh_awards.py
          python -u scripts/refresh_entities.py
          python scripts/validate_data.py
          python scripts/validate_change_data.py
          python scripts/validate_comparison.py
          python scripts/build_legal_review.py
          python scripts/validate_allocations.py
          python scripts/validate_legal_review.py
          node tests/recipient-sectors.cjs
      - name: Commit validated data and historical snapshot
        run: |
          git config user.name "federal-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update verified federal data and snapshot"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp favicon.svg atlas.css atlas-experience.js atlas-chart-tools.js index.html simple.html grant-change-examples.html workforce.js workforce.css research.js research.css atlas-bubbles.js notes.js legal-review.js outflows.js rebuild.js rebuild.css transitions.js _site/
          cp -r data vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
